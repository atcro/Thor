# Thor -- one command: `docker compose -f infra/docker-compose.yml up --build`
# (or `docker compose up --build` from the repo root via the symlinked compose.yaml).
#
# Services: timescale, mqtt, mlflow, api (control plane + orchestrator), edge (ONNX
# inference), replay (MQTT telemetry replay), web (React), plus the optional one-shot `prep`
# job (profile "prep": train, validate, promote, export, score -- the manual fallback when the
# presenter cannot train on stage). No Kubernetes, no MinIO, no Redis.
#
# A clean `docker compose up` does NOTHING on its own beyond seeding the recorded history: no
# model is trained, no prediction exists (every motor shows "no prediction yet") and the replay
# container holds (it polls GET /replay) until a named approver promotes a model in ModelOps.
# That sign-off releases the recorded plant history. See docs/finals/demo-walkthrough.md.

name: thor

# Host ports bind to 127.0.0.1 only: the demo is used from this machine, and the DB (thor/thor)
# and anonymous MQTT broker must not be reachable from shared Wi-Fi. Containers still talk to each
# other over the compose network by service name.

services:
  timescale:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: thor
      POSTGRES_PASSWORD: thor
      POSTGRES_DB: thor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thor -d thor"]
      interval: 5s
      timeout: 5s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
    volumes:
      - ../streaming/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t healthcheck -C 1 -W 2 -h localhost || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://thor:thor@timescale:5432/thor
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MQTT_BROKER_URL: mqtt://mqtt:1883
      CHROMA_PATH: /data/chroma
      MANUALS_DIR: /app/data/manuals
      MODELS_DIR: /models
      EDGE_URL: http://edge:8001
      SEED_ON_START: "1"
      SEED_FRACTION: ${SEED_FRACTION:-0.80}
    # LLM provider + keys (LLM_PROVIDER, OPENAI_API_KEY/OPENAI_MODEL, ANTHROPIC_API_KEY/
    # ANTHROPIC_MODEL) come from the repo-root .env. They are deliberately NOT listed under
    # `environment`: `${VAR}` interpolation only reads a .env next to this file (infra/), so
    # that form silently passed empty keys and the api ran in template mode. Only the api
    # service gets the file -- it holds the one module allowed to read the keys (CLAUDE.md 7).
    env_file:
      - path: ../.env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - models:/models
      - chroma-data:/data/chroma
      # chromadb's default embedding model (~80 MB ONNX) is downloaded into ~/.cache; persist
      # it so a restart does not re-download and re-initialise it.
      - model-cache:/root/.cache
    depends_on:
      timescale:
        condition: service_healthy
      mqtt:
        condition: service_started
      mlflow:
        condition: service_started

  # MANUAL FALLBACK ONLY (profile "prep", never started by a plain `docker compose up`):
  # one-shot demo preparation through the api's own governed endpoints -- train + validate a
  # champion (MTR-042 held out), approve its promotion as demo-prep@thor, export it for the
  # edge, score the fleet. Idempotent: skips training when a production model already exists.
  # Use it when training on stage fails:  docker compose run --rm prep
  # (or natively: python -m scripts.demo_prep --api http://localhost:8000). ~60-90 s.
  prep:
    profiles: ["prep"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "scripts.demo_prep", "--api", "http://api:8000", "--report", "/models/demo-prep-report.json"]
    environment:
      DATABASE_URL: postgresql+psycopg://thor:thor@timescale:5432/thor
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODELS_DIR: /models
      DEMO_PREP_TRIALS: ${DEMO_PREP_TRIALS:-4}
    volumes:
      - models:/models
    restart: "no"
    depends_on:
      api:
        condition: service_started
      timescale:
        condition: service_healthy

  edge:
    build:
      context: ..
      dockerfile: edge/Dockerfile
    environment:
      MQTT_BROKER_URL: mqtt://mqtt:1883
      MODELS_DIR: /models
      CONTROL_PLANE_URL: http://api:8000
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - models:/models
    depends_on:
      mqtt:
        condition: service_started
      api:
        condition: service_started

  # Streams the recorded plant history over MQTT -- but only once GET /replay says a
  # production model exists (the human sign-off); pause/resume via POST /replay/pause|resume.
  # Also applies the twin's sandbox overrides (GET /sandbox) and executes approved work orders.
  replay:
    build:
      context: ..
      dockerfile: streaming/replay/Dockerfile
    environment:
      MQTT_BROKER_URL: mqtt://mqtt:1883
      REPLAY_SPEED: ${REPLAY_SPEED:-900}
      REPLAY_START_FRACTION: ${REPLAY_START_FRACTION:-0.80}
      # approval = the simulated CMMS executes an approved work order at the next replayed row
      # (demo-visible within seconds); window = at the contract's scheduled window.
      REPLAY_WORK_ORDER_EXECUTE: ${REPLAY_WORK_ORDER_EXECUTE:-approval}
      CONTROL_PLANE_URL: http://api:8000
    depends_on:
      mqtt:
        condition: service_started
      api:
        condition: service_started

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_started

volumes:
  timescale-data:
  mlflow-data:
  models:
  chroma-data:
  model-cache:
