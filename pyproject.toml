[project]
name = "thor"
version = "0.1.0"
description = "Agentic AutoML + MLOps copilot for industrial predictive maintenance"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "xgboost>=2.0",
  "lightgbm>=4.3",
  "optuna>=3.6",
  "shap>=0.45",
  "mlflow>=2.14",
  "onnxruntime>=1.18",
  "skl2onnx>=1.17",
  "onnxmltools>=1.12",
  "onnx>=1.16",
  "paho-mqtt>=2.0",
  "chromadb>=0.5",
  "pypdf>=4.2",
  "langgraph>=0.2",
  "langchain-anthropic>=0.1",
  "anthropic>=0.30",
  "openai>=1.0",
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools]
packages = { find = { include = ["apps*", "agents*", "edge*", "streaming*", "data*"] } }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web", "mlruns", "data/benchmark/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
